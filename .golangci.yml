version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
    - wsl_v5
  settings:
    # The house layout rule: a blank line after every closing block. The other
    # wsl checks stay off.
    wsl_v5:
      default: none
      enable:
        - after-block
  exclusions:
    rules:
      # Examples are documentation: log.Fatal keeps them short.
      - path: example_test\.go
        linters: [gocritic]
        text: exitAfterDefer

formatters:
  enable:
    - gofmt
